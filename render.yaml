services:
  - type: web
    name: sprint-lens-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: JIRA_DEFAULT_PROJECTS
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "30"
      - key: CURSOR_API_KEY
        sync: false
      - key: KPI_PREFER_CURSOR_AGENT
        value: "true"
